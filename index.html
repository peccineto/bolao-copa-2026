<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bolão Copa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --surface2:#1c1c26;
  --surface3:#242432;
  --border:#2a2a3a;
  --border2:#383850;
  --text:#f0f0f8;
  --muted:#7070a0;
  --muted2:#4a4a6a;
  --green:#39d353;
  --green-dim:#1a5c2a;
  --green-bg:#0d2b15;
  --amber:#f5a623;
  --amber-bg:#2a1f00;
  --blue:#4a9eff;
  --blue-bg:#0a1e3a;
  --red:#ff4f4f;
  --red-bg:#2a0a0a;
  --gold:#ffd700;
  --accent:#39d353;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* TYPOGRAPHY */
.display{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;}
.label-xs{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

/* LAYOUT */
.app{max-width:480px;margin:0 auto;padding:0 16px 80px;}
.screen{display:none;}.screen.active{display:block;}

/* HEADER */
.hero{padding:40px 0 28px;text-align:center;position:relative;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-bg);border:1px solid var(--green-dim);border-radius:20px;padding:4px 12px;margin-bottom:16px;}
.hero-badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:52px;line-height:.95;text-transform:uppercase;letter-spacing:-0.02em;}
.hero-title span{color:var(--green);}
.hero-sub{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.03em;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;}
.card-sm{padding:14px 16px;}

/* INPUTS */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
input[type=text],input[type=number],input[type=password],select{
  width:100%;height:44px;padding:0 14px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:14px;font-family:'Inter',sans-serif;
  outline:none;transition:border-color .15s;
}
input:focus,select:focus{border-color:var(--green);}
input[type=number]{width:52px;text-align:center;padding:0 8px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green);color:#0a0a0f;width:100%;}
.btn-primary:hover{background:#45e560;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #3a1010;}
.btn-danger:hover{background:#3a1010;}

/* NAV TABS */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);}
.bottom-nav-inner{max-width:480px;margin:0 auto;display:flex;padding:0 8px;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border-radius:10px;transition:background .12s;background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;}
.nav-item:hover{background:var(--surface2);}
.nav-item.active{color:var(--green);}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-item span{font-size:10px;font-weight:500;}

/* SECTION TITLES */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:20px;}
.section-head:first-child{margin-top:0;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-dim);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-muted{background:var(--surface2);color:var(--muted);}

/* GAME ROWS */
.game-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.game-row:last-child{border-bottom:none;}
.team-side{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
.team-side.right{flex-direction:row-reverse;text-align:right;}
.team-flag{font-size:18px;flex-shrink:0;display:flex;align-items:center;}
.team-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.score-center{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.score-sep{color:var(--muted2);font-size:12px;}
.score-final{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text);padding:2px 14px;background:var(--surface2);border-radius:8px;letter-spacing:.02em;}
.my-guess{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;}

/* RANKING */
.rank-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{width:28px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--muted2);flex-shrink:0;}
.rank-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;border:1px solid var(--border);}
.rank-info{flex:1;min-width:0;}
.rank-name-text{font-size:14px;font-weight:500;}
.rank-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.rank-pts-num{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--green);}
.rank-pts-label{font-size:10px;color:var(--muted);text-align:right;}
.rank-row.me .rank-name-text{color:var(--green);}
.rank-row.me .rank-avatar{border-color:var(--green);background:var(--green-bg);}
.gold-row .rank-pos{color:var(--gold);}
.silver-row .rank-pts-num{color:#c0c0c0;}
.bronze-row .rank-pts-num{color:#cd7f32;}

/* PONTUAÇÃO */
.pts-rule{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.pts-rule:last-child{border-bottom:none;}
.pts-rule-info{flex:1;}
.pts-rule-label{font-size:13px;font-weight:500;}
.pts-rule-ex{font-size:11px;color:var(--muted);margin-top:2px;}
.pts-chip{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;padding:4px 12px;border-radius:8px;flex-shrink:0;margin-left:12px;}
.chip-gold{background:#2a2000;color:var(--gold);}
.chip-green{background:var(--green-bg);color:var(--green);}
.chip-blue{background:var(--blue-bg);color:var(--blue);}
.chip-purple{background:#1a1040;color:#a090ff;}
.chip-amber{background:var(--amber-bg);color:var(--amber);}
.chip-red{background:var(--red-bg);color:#ff9090;}
.chip-muted{background:var(--surface2);color:var(--muted);}
.top-rule{border:1px solid #2a4020;background:#0d1f0d;border-radius:12px;padding:12px 14px;margin-bottom:4px;}
.top-rule-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--green);color:#0a0a0f;border-radius:4px;padding:2px 7px;margin-bottom:6px;}

/* BONUS */
.bonus-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;}
.bonus-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.bonus-opt{padding:7px 12px;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:8px;cursor:pointer;background:transparent;color:var(--text);transition:all .12s;font-family:'Inter',sans-serif;}
.bonus-opt:hover{border-color:var(--green);color:var(--green);}
.bonus-opt.sel{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.search-wrap{position:relative;}
.search-drop{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:10px;z-index:100;max-height:200px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.search-drop.open{display:block;}
.search-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;}
.search-item:hover{background:var(--surface2);}

/* ALERTS */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;}
.alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-dim);}
.alert-err{background:var(--red-bg);color:var(--red);border:1px solid #3a1010;}
.alert-info{background:var(--blue-bg);color:var(--blue);border:1px solid #102040;}
.alert-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #3a2a00;}

/* CAIXA BAR */
.prize-bar{background:linear-gradient(135deg,#0d2b15,#142b0a);border:1px solid var(--green-dim);border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.prize-amount{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:var(--green);line-height:1;}
.prize-label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.prize-right{text-align:right;}
.prize-n{font-size:13px;font-weight:500;}

/* ADMIN LOGIN */
.admin-link{text-align:center;margin-top:8px;}
.admin-link button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;}
.admin-link button:hover{color:var(--text);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface);border:1px solid var(--green-dim);color:var(--green);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* RESPONSIVE TWEAKS */
@media(max-width:380px){
  .hero-title{font-size:44px;}
  .app{padding:0 12px 80px;}
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="app">

<!-- ===== LOGIN ===== -->
<div id="s-login" class="screen active">
  <div class="hero">
    <div class="hero-badge">
      <span>AO VIVO</span>
      Copa 2026
    </div>
    <div class="hero-title">Bol<span>ã</span>o<br/>Copa<br/><span>2026</span></div>
    <div class="hero-sub">EUA · México · Canadá &nbsp;·&nbsp; 11 jun – 19 jul</div>
  </div>

  <div class="card">
    <div class="field">
      <label>Seu nome</label>
      <input type="text" id="l-name" placeholder="Ex: Pecci" autocomplete="off"/>
    </div>
    <div class="field" style="margin-bottom:20px">
      <label>Senha do bolão</label>
      <input type="password" id="l-pass" placeholder="••••••" autocomplete="off"/>
    </div>
    <button class="btn btn-primary" onclick="doLogin()">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar
    </button>
    <div id="l-err" style="display:none;margin-top:10px;"></div>
  </div>

  <div class="admin-link">
    <button onclick="showScreen('s-admin-setup')">Sou o admin do bolão</button>
  </div>
</div>

<!-- ===== ADMIN SETUP ===== -->
<div id="s-admin-setup" class="screen">
  <div style="padding:20px 0 16px;display:flex;align-items:center;gap:10px;">
    <button class="btn btn-ghost btn-sm" onclick="showScreen('s-login')">← Voltar</button>
    <div class="section-title">Admin</div>
  </div>

  <div class="card">
    <div class="section-title" style="font-size:14px;margin-bottom:16px;">Criar bolão</div>
    <div class="field">
      <label>Senha admin (só você sabe)</label>
      <input type="text" id="a-newpass" placeholder="Ex: meubrete2026"/>
    </div>
    <div class="field">
      <label>Senha dos participantes</label>
      <input type="text" id="p-newpass" placeholder="Ex: copa2026"/>
    </div>
    <div class="field" style="margin-bottom:20px">
      <label>Valor por pessoa (R$)</label>
      <input type="number" id="b-valor" value="100" style="width:90px"/>
    </div>
    <button class="btn btn-primary" onclick="createBolao()">Criar bolão</button>
    <div id="setup-msg" style="display:none;margin-top:10px;"></div>
  </div>

  <div class="divider"></div>

  <div class="card">
    <div class="section-title" style="font-size:14px;margin-bottom:12px;">Já tem bolão? Entre como admin</div>
    <div class="field" style="margin-bottom:12px">
      <label>Senha admin</label>
      <input type="password" id="a-loginpass" placeholder="••••••"/>
    </div>
    <button class="btn btn-ghost" onclick="adminLogin()" style="width:100%">Entrar como admin</button>
    <div id="a-err" style="display:none;margin-top:10px;"></div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="s-main" class="screen">
  <div id="main-header" style="padding:20px 0 4px;"></div>
  <div id="prize-area"></div>

  <div id="t-palpites" class="tab-content"></div>
  <div id="t-ranking" class="tab-content" style="display:none"></div>
  <div id="t-bonus" class="tab-content" style="display:none"></div>
  <div id="t-resultados" class="tab-content" style="display:none"></div>
  <div id="t-pontuacao" class="tab-content" style="display:none"></div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-item active" data-tab="palpites" onclick="switchTab('palpites',this)">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>Palpites</span>
      </button>
      <button class="nav-item" data-tab="ranking" onclick="switchTab('ranking',this)">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>Ranking</span>
      </button>
      <button class="nav-item" data-tab="bonus" onclick="switchTab('bonus',this)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <span>Bônus</span>
      </button>
      <button class="nav-item" data-tab="resultados" onclick="switchTab('resultados',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <span>Jogos</span>
      </button>
      <button class="nav-item" data-tab="pontuacao" onclick="switchTab('pontuacao',this)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>Regras</span>
      </button>
    </div>
  </nav>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="s-admin" class="screen">
  <div style="padding:20px 0 8px;display:flex;align-items:center;justify-content:space-between;">
    <div class="section-title" style="font-size:20px;">⚙️ Admin</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div id="admin-caixa-badge" class="badge badge-green" style="font-size:13px;"></div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div style="display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;">
    <button class="btn btn-ghost btn-sm act-tab" data-atab="resultados" onclick="switchAdminTab('resultados',this)" style="white-space:nowrap;flex-shrink:0;">Resultados</button>
    <button class="btn btn-ghost btn-sm" data-atab="bonus-res" onclick="switchAdminTab('bonus-res',this)" style="white-space:nowrap;flex-shrink:0;">Bônus</button>
    <button class="btn btn-ghost btn-sm" data-atab="participantes" onclick="switchAdminTab('participantes',this)" style="white-space:nowrap;flex-shrink:0;">Participantes</button>
    <button class="btn btn-ghost btn-sm" data-atab="ranking-a" onclick="switchAdminTab('ranking-a',this)" style="white-space:nowrap;flex-shrink:0;">Ranking</button>
  </div>

  <div id="a-tab-resultados"></div>
  <div id="a-tab-bonus-res" style="display:none"></div>
  <div id="a-tab-participantes" style="display:none"></div>
  <div id="a-tab-ranking-a" style="display:none"></div>
</div>

</div><!-- .app -->

<script>
// ─── DATA ───────────────────────────────────────────────
const GROUPS_DATA={
  A:["México","África do Sul","Coreia do Sul","Rep. Tcheca"],
  B:["Canadá","Bósnia","Catar","Suíça"],
  C:["Brasil","Marrocos","Haiti","Escócia"],
  D:["Estados Unidos","Paraguai","Austrália","Turquia"],
  E:["Alemanha","Curaçao","Costa do Marfim","Equador"],
  F:["Holanda","Japão","Suécia","Tunísia"],
  G:["Bélgica","Egito","Irã","Nova Zelândia"],
  H:["Espanha","Cabo Verde","Arábia Saudita","Uruguai"],
  I:["França","Senegal","Noruega","Iraque"],
  J:["Argentina","Argélia","Áustria","Jordânia"],
  K:["Portugal","Uzbequistão","Colômbia","RD Congo"],
  L:["Inglaterra","Croácia","Gana","Panamá"]
};

// ISO country codes for flag images
const FLAG_CODES={"México":"mx","África do Sul":"za","Coreia do Sul":"kr","Rep. Tcheca":"cz","Canadá":"ca","Bósnia":"ba","Catar":"qa","Suíça":"ch","Brasil":"br","Marrocos":"ma","Haiti":"ht","Escócia":"gb-sct","Estados Unidos":"us","Paraguai":"py","Austrália":"au","Turquia":"tr","Alemanha":"de","Curaçao":"cw","Costa do Marfim":"ci","Equador":"ec","Holanda":"nl","Japão":"jp","Suécia":"se","Tunísia":"tn","Bélgica":"be","Egito":"eg","Irã":"ir","Nova Zelândia":"nz","Espanha":"es","Cabo Verde":"cv","Arábia Saudita":"sa","Uruguai":"uy","França":"fr","Senegal":"sn","Noruega":"no","Iraque":"iq","Argentina":"ar","Argélia":"dz","Áustria":"at","Jordânia":"jo","Portugal":"pt","Uzbequistão":"uz","Colômbia":"co","RD Congo":"cd","Inglaterra":"gb-eng","Croácia":"hr","Gana":"gh","Panamá":"pa"};
function flagImg(name,size=20){const c=FLAG_CODES[name];if(!c)return'<span style="font-size:16px">🏳</span>';return`<img src="https://flagcdn.com/w${size}/${c}.png" srcset="https://flagcdn.com/w${size*2}/${c}.png 2x" width="${size}" height="${Math.round(size*0.75)}" alt="${name}" style="border-radius:2px;object-fit:cover;vertical-align:middle;flex-shrink:0"/>`;}
const FLAGS={};

const ALL_TEAMS=Object.values(GROUPS_DATA).flat();

const AVATAR_COLORS=['#1a3a1a','#1a1a3a','#3a1a1a','#1a3a3a','#2a2a1a','#2a1a3a'];
function avatarColor(name){return AVATAR_COLORS[name.charCodeAt(0)%AVATAR_COLORS.length];}
function initials(name){return name.slice(0,2).toUpperCase();}

function genGames(){
  const g=[];let id=1;
  Object.entries(GROUPS_DATA).forEach(([grp,ts])=>{
    for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)
      g.push({id:id++,grp,home:ts[i],away:ts[j],phase:"Grupos",result:null});
  });
  const ko=[
    ["1A","2B"],["1B","2A"],["1C","2D"],["1D","2C"],
    ["1E","2F"],["1F","2E"],["1G","2H"],["1H","2G"],
    ["1I","2J"],["1J","2I"],["1K","2L"],["1L","2K"]
  ].map(([h,a])=>({id:id++,grp:null,home:h,away:a,phase:"Oitavas",result:null}));
  const q=[
    ["W-O1","W-O2"],["W-O3","W-O4"],["W-O5","W-O6"],["W-O7","W-O8"],
    ["W-O9","W-O10"],["W-O11","W-O12"]
  ].map(([h,a])=>({id:id++,grp:null,home:h,away:a,phase:"Quartas",result:null}));
  const sf=[["W-Q1","W-Q2"],["W-Q3","W-Q4"]].map(([h,a])=>({id:id++,grp:null,home:h,away:a,phase:"Semifinal",result:null}));
  const fin=[{id:id++,grp:null,home:"P-SF1",away:"P-SF2",phase:"3° lugar",result:null},{id:id++,grp:null,home:"W-SF1",away:"W-SF2",phase:"Final",result:null}];
  return [...g,...ko,...q,...sf,...fin];
}

// ─── SCORING ─────────────────────────────────────────────
function calcPts(player){
  let pts=0,exact=0,w18=0,w15g=0,draw=0,w12=0,w6=0,w3=0;
  S.games.forEach(g=>{
    if(!g.result)return;
    const p=player.palpites[g.id];
    if(!p||p.h===''||p.a==='')return;
    const ph=parseInt(p.h),pa=parseInt(p.a),rh=g.result.h,ra=g.result.a;
    if(ph===rh&&pa===ra){pts+=25;exact++;return;}
    const pWin=ph>pa?1:ph<pa?-1:0;
    const rWin=rh>ra?1:rh<ra?-1:0;
    if(pWin===0&&rWin===0){pts+=15;draw++;return;}
    if(pWin===rWin){
      if(ph===rh||pa===ra){pts+=18;w18++;return;}
      if((ph-pa)===(rh-ra)){pts+=15;w15g++;return;}
      if((ph===rh)||(pa===ra)){pts+=12;w12++;return;}
      pts+=6;w6++;return;
    }
    if(ph===rh||pa===ra){pts+=3;w3++;}
  });
  const b=player.bonus||{};
  if(S.cfg.champion&&b.champion===S.cfg.champion)pts+=40;
  if(S.cfg.runnerUp&&b.runnerUp===S.cfg.runnerUp)pts+=20;
  if(S.cfg.third&&b.third===S.cfg.third)pts+=10;
  if(S.cfg.champGoals&&b.champGoals===S.cfg.champGoals)pts+=20;
  return{pts,exact,w18,w15g,draw,w12,w6,w3};
}

function gameRowHTML(g,pl){
  const p=pl?pl.palpites[g.id]||{h:'',a:''}:{h:'',a:''};
  const locked=g.result!==null;
  const hf=flagImg(g.home);const af=flagImg(g.away);
  if(locked){
    const pts=pl?getPtsForGame(g,p):null;
    const ptsHtml=pts!==null&&pts>0?`<span class="badge badge-green" style="font-size:10px;">+${pts}</span>`:'';
    return `<div class="game-row">
      <div class="team-side right"><span class="team-name">${g.home}</span><span class="team-flag">${hf}</span></div>
      <div style="text-align:center;flex-shrink:0;">
        <div class="score-final">${g.result.h}–${g.result.a}</div>
        <div class="my-guess">${p.h!==''?`seu: ${p.h}-${p.a} ${ptsHtml}`:'sem palpite'}</div>
      </div>
      <div class="team-side"><span class="team-flag">${af}</span><span class="team-name">${g.away}</span></div>
    </div>`;
  }
  return `<div class="game-row">
    <div class="team-side right"><span class="team-name">${g.home}</span><span class="team-flag">${hf}</span></div>
    <div class="score-center">
      <input type="number" min="0" max="20" value="${p.h}" placeholder="–" onchange="savePalpite(${g.id},'h',this.value)" />
      <span class="score-sep">–</span>
      <input type="number" min="0" max="20" value="${p.a}" placeholder="–" onchange="savePalpite(${g.id},'a',this.value)" />
    </div>
    <div class="team-side"><span class="team-flag">${af}</span><span class="team-name">${g.away}</span></div>
  </div>`;
}

function getPtsForGame(g,p){
  if(!g.result||p.h===''||p.a==='')return 0;
  const ph=parseInt(p.h),pa=parseInt(p.a),rh=g.result.h,ra=g.result.a;
  if(ph===rh&&pa===ra)return 25;
  const pW=ph>pa?1:ph<pa?-1:0,rW=rh>ra?1:rh<ra?-1:0;
  if(pW===0&&rW===0)return 15;
  if(pW===rW){if(ph===rh||pa===ra)return 18;if((ph-pa)===(rh-ra))return 15;if(ph===rh||pa===ra)return 12;return 6;}
  if(ph===rh||pa===ra)return 3;
  return 0;
}

      const hf=flagImg(g.home);const af=flagImg(g.away);
      html+=`<div class="game-row">
        <div class="team-side right"><span class="team-name">${g.home}</span><span class="team-flag">${hf}</span></div>
        <div class="score-final">${g.result.h}–${g.result.a}</div>
        <div class="team-side"><span class="team-flag">${af}</span><span class="team-name">${g.away}</span></div>
      </div>`;
    });
    html+=`</div>`;
  }
  if(upcoming.length){
    html+=`<div class="section-head"><div class="section-title">Próximos</div></div><div class="card">`;
    upcoming.forEach(g=>{
      const hf=flagImg(g.home);const af=flagImg(g.away);
      html+=`<div class="game-row">
        <div class="team-side right"><span class="team-name">${g.home}</span><span class="team-flag">${hf}</span></div>
        <span style="font-size:12px;color:var(--muted2);padding:2px 10px;">vs</span>
        <div class="team-side"><span class="team-flag">${af}</span><span class="team-name">${g.away}</span></div>
      </div>`;
    });
    html+=`</div>`;
  }
  if(!withResult.length&&!upcoming.length)html='<div style="text-align:center;padding:40px 0;color:var(--muted);">Nenhum resultado lançado ainda</div>';
  document.getElementById('t-resultados').innerHTML=html;
}

function renderPontuacao(){

    {label:'Vencedor + gols',ex:'Palpitou 2×1, terminou 2×0',chip:'chip-green',pts:18},
    {label:'Vencedor + saldo de gols',ex:'Palpitou 2×1, terminou 1×0',chip:'chip-blue',pts:15},
    {label:'Empate',ex:'Palpitou 2×2, terminou 1×1',chip:'chip-blue',pts:15},
    {label:'Vencedor + gols do perdedor',ex:'Palpitou 2×0, terminou 3×0',chip:'chip-purple',pts:12},
    {label:'Só o vencedor',ex:'Palpitou 2×0, terminou 3×2',chip:'chip-amber',pts:6},
    {label:'Placar de um time',ex:'Palpitou 3×0, terminou 0×3',chip:'chip-muted',pts:3},

  html+=`<div class="card" style="margin-bottom:8px;">`;

  rules.slice(1).forEach(r=>{
    html+=`<div class="pts-rule"><div class="pts-rule-info"><div class="pts-rule-label">${r.label}</div><div class="pts-rule-ex">${r.ex}</div></div><span class="pts-chip ${r.chip}">+${r.pts}</span></div>`;
  });
  html+=`</div>`;
  html+=`<div class="section-title" style="margin:16px 0 10px;">Perguntas bônus</div><div class="card">`;
  bonus.forEach((b,i)=>{
    html+=`<div class="pts-rule"${i===bonus.length-1?' style="border-bottom:none"':''}><div class="pts-rule-info"><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">${b.icon}</span><span class="pts-rule-label">${b.label}</span></div></div><span class="pts-chip chip-green">+${b.pts}</span></div>`;
  });
  html+=`</div>`;
  html+=`<div class="card" style="margin-top:8px;"><div class="label-xs" style="margin-bottom:8px;">Regra de desempate</div><p style="font-size:13px;color:var(--muted);line-height:1.6;">Em caso de empate na pontuação, vence quem tiver mais acertos na regra de maior valor. Se persistir, avança pra próxima regra.</p></div>`;
  document.getElementById('t-pontuacao').innerHTML=html;

// Name mapping: openfootball names → our app names
const NAME_MAP={
  'Mexico':'México','South Africa':'África do Sul','South Korea':'Coreia do Sul',
  'Czech Republic':'Rep. Tcheca','Canada':'Canadá','Bosnia & Herzegovina':'Bósnia',
  'Qatar':'Catar','Switzerland':'Suíça','Brazil':'Brasil','Morocco':'Marrocos',
  'Haiti':'Haiti','Scotland':'Escócia','USA':'Estados Unidos','United States':'Estados Unidos',
  'Paraguay':'Paraguai','Australia':'Austrália','Turkey':'Turquia','Germany':'Alemanha',
  'Curaçao':'Curaçao','Côte d\'Ivoire':'Costa do Marfim','Ivory Coast':'Costa do Marfim',
  'Ecuador':'Equador','Netherlands':'Holanda','Japan':'Japão','Sweden':'Suécia',
  'Tunisia':'Tunísia','Belgium':'Bélgica','Egypt':'Egito','Iran':'Irã',
  'New Zealand':'Nova Zelândia','Spain':'Espanha','Cape Verde':'Cabo Verde',
  'Saudi Arabia':'Arábia Saudita','Uruguay':'Uruguai','France':'França',
  'Senegal':'Senegal','Norway':'Noruega','Iraq':'Iraque','Argentina':'Argentina',
  'Algeria':'Argélia','Austria':'Áustria','Jordan':'Jordânia','Portugal':'Portugal',
  'Uzbekistan':'Uzbequistão','Colombia':'Colômbia','DR Congo':'RD Congo',
  'England':'Inglaterra','Croatia':'Croácia','Ghana':'Gana','Panama':'Panamá'
};
function mapName(n){return NAME_MAP[n]||n;}

async function fetchResultsAuto(){
  const btn=document.getElementById('fetch-btn');
  if(btn){btn.textContent='Buscando...';btn.disabled=true;}
  try{
    const r=await fetch('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json');
    const d=await r.json();
    let updated=0;
    d.matches.forEach(m=>{
      if(!m.score1&&m.score1!==0) return;
      const h=mapName(m.team1);
      const a=mapName(m.team2);
      const game=S.games.find(g=>
        g.phase==='Grupos'&&
        g.home===h&&g.away===a
      );
      if(game&&(game.result===null||game.result===undefined)){
        game.result={h:parseInt(m.score1),a:parseInt(m.score2)};
        updated++;
      }
    });
    saveS();
    renderAdminResultados();
    if(updated>0){toast(`✓ ${updated} resultado${updated>1?'s':''} atualizado${updated>1?'s':''}!`);}
    else{toast('Nenhum resultado novo ainda','err');}
  }catch(e){
    toast('Erro ao buscar resultados','err');
  }finally{
    if(btn){btn.textContent='⟳ Buscar resultados';btn.disabled=false;}
  }
}

function renderAdminResultados(){
  const withResult=S.games.filter(g=>g.result).length;
  let html=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
    <button id="fetch-btn" class="btn btn-primary" style="flex:1;min-width:180px;" onclick="fetchResultsAuto()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Buscar resultados automático
    </button>
    <span class="badge badge-green">${withResult} jogos confirmados</span>
  </div>
  <div class="alert alert-info" style="margin-bottom:16px;font-size:12px;">Atualiza automaticamente via API pública. Você também pode lançar manualmente abaixo.</div>`;
  const phases=['Grupos','Oitavas','Quartas','Semifinal','3° lugar','Final'];
  phases.forEach(phase=>{
    const games=S.games.filter(g=>g.phase===phase);if(!games.length)return;
    if(phase==='Grupos'){
      const byGrp={};games.forEach(g=>{if(!byGrp[g.grp])byGrp[g.grp]=[];byGrp[g.grp].push(g);});
      Object.entries(byGrp).forEach(([grp,gs])=>{
        html+=`<div class="section-head"><div class="section-title">Grupo ${grp}</div></div><div class="card">`;
        gs.forEach(g=>html+=adminGameRowHTML(g));
        html+=`</div>`;
      });
    } else {
      html+=`<div class="section-head"><div class="section-title">${phase}</div></div><div class="card">`;
      games.forEach(g=>html+=adminGameRowHTML(g));
      html+=`</div>`;
    }
  });
  document.getElementById('a-tab-resultados').innerHTML=html;
}

let pR={};
function adminGameRowHTML(g){
  const r=g.result||{h:'',a:''};
  const hf=flagImg(g.home);const af=flagImg(g.away);
  return `<div class="game-row" style="gap:6px;">
    <div class="team-side right" style="min-width:0;"><span class="team-name" style="font-size:12px;">${g.home}</span><span class="team-flag" style="font-size:15px;">${hf}</span></div>
    <div class="score-center" style="gap:4px;">
      <input type="number" min="0" max="20" value="${r.h}" onchange="pR[${g.id}]=pR[${g.id}]||{h:'',a:''};pR[${g.id}].h=this.value" style="width:46px;font-size:14px;"/>
      <span class="score-sep">–</span>
      <input type="number" min="0" max="20" value="${r.a}" onchange="pR[${g.id}]=pR[${g.id}]||{h:'',a:''};pR[${g.id}].a=this.value" style="width:46px;font-size:14px;"/>
      <button class="btn btn-sm ${g.result?'btn-primary':''}" onclick="confirmResult(${g.id})" style="padding:6px 10px;font-size:11px;">${g.result?'✓':'OK'}</button>
    </div>
    <div class="team-side" style="min-width:0;"><span class="team-flag" style="font-size:15px;">${af}</span><span class="team-name" style="font-size:12px;">${g.away}</span></div>
  </div>`;
}

function confirmResult(id){
  const pr=pR[id];
  if(!pr||pr.h===''||pr.a===''){toast('Preencha os dois placares','err');return;}
  const g=S.games.find(g=>g.id===id);
  g.result={h:parseInt(pr.h)||0,a:parseInt(pr.a)||0};
  delete pR[id];saveS();renderAdminResultados();toast('Resultado salvo ✓');
}

function renderAdminBonus(){
  const questions=[
    {key:'champGoals',label:'Gols do campeão',pts:20,icon:'⚽',type:'choice',opts:['< 10','10–30','30–50','50–70','70–90','> 110']},
    {key:'third',label:'Terceiro colocado',pts:10,icon:'🥉',type:'team'},
    {key:'runnerUp',label:'Vice-campeão',pts:20,icon:'🥈',type:'team'},
    {key:'champion',label:'Campeão',pts:40,icon:'🏆',type:'team'},
  ];
  let html=`<div class="section-title" style="margin-bottom:12px;">Gabarito bônus</div>`;
  questions.forEach(q=>{
    const cur=S.cfg[q.key];
    html+=`<div class="bonus-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">${q.icon}</span><span style="font-size:13px;font-weight:500;">${q.label}</span></div>
        <span class="badge badge-green">+${q.pts}</span>
      </div>`;
    if(q.type==='choice'){
      html+=`<div class="bonus-opts">`;
      q.opts.forEach(o=>html+=`<button class="bonus-opt${cur===o?' sel':''}" onclick="S.cfg['${q.key}']='${o}';saveS();renderAdminBonus();toast('Gabarito salvo');">${o}</button>`);
      html+=`</div>`;
    } else {
      html+=`<div class="search-wrap"><input type="text" id="abs-${q.key}" placeholder="Buscar..." oninput="filterTeams('${q.key}',this.value,true)" autocomplete="off" value="${cur||''}" style="width:100%;"/><div id="abd-${q.key}" class="search-drop"></div></div>`;
      if(cur)html+=`<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;">${flagImg(cur,20)} <strong>${cur}</strong> <button class="btn btn-ghost btn-sm" onclick="S.cfg['${q.key}']=null;saveS();renderAdminBonus();">Limpar</button></div>`;
    }
    html+=`</div>`;
  });
  document.getElementById('a-tab-bonus-res').innerHTML=html;
}

function selTeamAdmin(key,team){
  S.cfg[key]=team;saveS();
  const el=document.getElementById('abs-'+key);if(el)el.value=team;
  const dr=document.getElementById('abd-'+key);if(dr)dr.classList.remove('open');
  renderAdminBonus();toast('Gabarito salvo');
}

function renderAdminParticipantes(){
  const players=Object.keys(S.players);
  const total=players.length*S.cfg.valor;
  let html=`<div class="prize-bar" style="margin-bottom:12px;"><div><div class="prize-label">Caixa total</div><div class="prize-amount">R$ ${total.toLocaleString('pt-BR')}</div></div><div class="prize-right"><div class="prize-n">${players.length} participantes</div><div style="font-size:11px;color:var(--muted);">Senha: <strong style="color:var(--text);">${S.cfg.playerPass}</strong></div></div></div>`;
  if(!players.length)html+='<div style="text-align:center;padding:30px;color:var(--muted);">Nenhum participante ainda</div>';
  else{
    html+=`<div class="card">`;
    players.forEach(name=>{
      const p=S.players[name];
      const done=Object.keys(p.palpites).filter(k=>{const pp=p.palpites[k];return pp.h!==''&&pp.a!==''}).length;
      const champ=(p.bonus||{}).champion||'–';
      html+=`<div class="rank-row">
        <div class="rank-avatar" style="background:${avatarColor(name)}">${initials(name)}</div>
        <div class="rank-info"><div class="rank-name-text">${name}</div><div class="rank-sub">${done}/${S.games.length} palpites · ${flagImg(champ,14)} ${champ}</div></div>
        <button class="btn btn-danger btn-sm" onclick="removePlayer('${name}')">✕</button>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('a-tab-participantes').innerHTML=html;
}

function removePlayer(name){
  if(!confirm(`Remover ${name}?`))return;
  delete S.players[name];saveS();renderAdminParticipantes();toast('Participante removido');
}

function renderAdminRanking(){
  const gamesR=S.games.filter(g=>g.result).length;
  const players=Object.entries(S.players).map(([name,data])=>{
    const{pts,exact,w18}=calcPts(data);return{name,pts,exact,w18};
  }).sort((a,b)=>b.pts-a.pts);
  const total=players.length*S.cfg.valor;
  let html=`<div class="alert alert-info" style="margin-bottom:12px;">${gamesR}/${S.games.length} jogos com resultado</div>`;
  if(total>0){
    html+=`<div class="prize-bar" style="margin-bottom:12px;"><div><div class="prize-label">Prêmio total</div><div class="prize-amount">R$ ${total.toLocaleString('pt-BR')}</div></div><div class="prize-right"><div style="font-size:13px;">🥇 R$ ${Math.round(total*.7).toLocaleString('pt-BR')}</div><div style="font-size:12px;color:var(--muted);">🥈 R$ ${Math.round(total*.3).toLocaleString('pt-BR')}</div></div></div>`;
  }
  if(!players.length)html+='<div style="text-align:center;padding:30px;color:var(--muted);">Nenhum participante</div>';
  else{
    html+=`<div class="card">`;
    players.forEach((p,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      html+=`<div class="rank-row">
        <div class="rank-pos">${medal||i+1}</div>
        <div class="rank-avatar" style="background:${avatarColor(p.name)}">${initials(p.name)}</div>
        <div class="rank-info"><div class="rank-name-text">${p.name}</div><div class="rank-sub">${p.exact} exatos · ${p.w18} venc+gols</div></div>
        <div style="text-align:right;"><div class="rank-pts-num">${p.pts}</div><div class="rank-pts-label">pts</div></div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('a-tab-ranking-a').innerHTML=html;
}
